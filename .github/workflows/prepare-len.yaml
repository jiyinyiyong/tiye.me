name: Prepare reviewed typed List length migration
on:
  push:
    branches: [prepare/typed-list-len456]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Original formal baseline gates
        run: |
          set -euo pipefail
          test "$(calcit -v)" = "0.30.1"
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru deps.cirru package.json yarn.lock
          bash reviewed-gates.sh > acceptance-before.log 2>&1
      - name: Official scoped source transaction
        run: node apply-reviewed.mjs apply
      - name: Full after-source formal gates
        run: |
          set -euo pipefail
          bash reviewed-gates.sh > acceptance-after.log 2>&1
          calcit calcit.cirru edit format
          node apply-reviewed.mjs verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tiye-len457-diagnostics
          path: |
            acceptance
            acceptance-*.log
          if-no-files-found: error
          retention-days: 30
